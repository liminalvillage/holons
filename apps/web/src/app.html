<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#1f2937" />

    <!-- Warm up the TLS/TCP handshake to the third-party script origins so the
         deferred Telegram SDK and async Google Translate widget start fetching
         sooner. -->
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <link rel="preconnect" href="https://translate.google.com" crossorigin />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Apply the saved visual skin AND any custom accent before first paint to
         avoid a flash of the wrong theme. Mirrors $lib/stores/skin (keys:
         harvest_skin, harvest_accent_<skin>). -->
    <script>
      (function () {
        try {
          var s =
            localStorage.getItem("harvest_skin") === "whiteboard"
              ? "whiteboard"
              : "blackboard";
          document.documentElement.setAttribute("data-skin", s);
          var hex = localStorage.getItem("harvest_accent_" + s);
          if (hex && /^#[0-9a-fA-F]{6}$/.test(hex)) {
            var n = parseInt(hex.slice(1), 16),
              r = (n >> 16) & 255,
              g = (n >> 8) & 255,
              b = n & 255;
            var mix = function (t, a) {
              var tc = [(t >> 16) & 255, (t >> 8) & 255, t & 255];
              return (
                "#" +
                [r, g, b]
                  .map(function (v, i) {
                    return Math.round(v + (tc[i] - v) * a)
                      .toString(16)
                      .padStart(2, "0");
                  })
                  .join("")
              );
            };
            var st = document.documentElement.style;
            st.setProperty("--color-accent", hex);
            st.setProperty("--color-accent-hover", mix(0x000000, 0.16));
            st.setProperty("--color-accent-light", mix(0xffffff, 0.18));
            st.setProperty(
              "--color-accent-subtle",
              "rgba(" + r + ", " + g + ", " + b + ", 0.14)",
            );
          }
        } catch (e) {
          document.documentElement.setAttribute("data-skin", "blackboard");
        }
      })();
    </script>

    <!-- Suppress Google Translate logging errors (blocked by ad blockers).
		     Inline so it intercepts console.error before any other script can
		     emit one. Trivially small; moving to a file would defeat the point. -->
    <script>
      (function () {
        const originalError = console.error;
        console.error = function (...args) {
          const str = args.join(" ");
          if (
            str.includes("translate.google") ||
            str.includes("ERR_BLOCKED_BY_CLIENT")
          ) {
            return;
          }
          originalError.apply(console, args);
        };
      })();
    </script>

    <!-- Telegram WebApp SDK. `defer` keeps it off the critical rendering path
         while still guaranteeing it runs (in document order) before the
         deferred SvelteKit app module, so window.Telegram is ready at mount. -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>

    <!-- Google Translate widget bootstrap. Local script defines
		     `googleTranslateElementInit` before element.js loads async. -->
    <link rel="stylesheet" href="%sveltekit.assets%/google-translate.css" />
    <!-- Both deferred so neither blocks first paint. `defer` preserves document
         order, so google-translate.js defines googleTranslateElementInit before
         element.js loads and invokes it. -->
    <script src="%sveltekit.assets%/google-translate.js" defer></script>
    <script
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      defer
    ></script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
