# Netlify config for Flows (apps/flows) — SvelteKit on adapter-netlify.
#
# In the Netlify site settings set the base directory to `apps/flows` so this
# file is picked up. Install + build run from the monorepo root (`cd ../..`) so
# the pnpm workspace is intact and @holons/core is BUILT before the app (the
# apps consume core's compiled dist, not its TS source).
#
# Pages are client-side (SPA); sign-in (Telegram OIDC, and the key logins'
# session cookie) needs a server, so adapter-netlify serves the CSR shell +
# the /api/auth/* serverless functions and generates its own routing — do NOT
# add a manual `/* -> /index.html` redirect (it would shadow the functions).
#
# Required server env vars (set in the Netlify UI, NOT here — they are
# secrets): TELEGRAM_OIDC_CLIENT_ID, TELEGRAM_OIDC_CLIENT_SECRET,
# AUTH_JWT_SECRET; NOSTR_DERIVATION_SECRET when a Telegram login should sign
# with the person's own derived key (as on the kiosk). Register the callback
# in BotFather Web Login → Allowed URLs:
#   https://<site>/api/auth/telegram/callback
# A site outside *.hubs.network keeps its own session (the cookie is not
# shared with the kiosk) and returns to its front page after a Telegram
# login rather than to the page the login began on.
#
# Client env vars (public by design, still needed in the Netlify UI):
#   VITE_FLOWS_POT   — the Pot holon whose flows this site shows (pinned below)
#   VITE_FLOWS_APP   — the Holosphere namespace (pinned below; "Holons" if unset)
#   VITE_FLOWS_RELAYS — relay list, when not the production set
#   VITE_FLOWS_LOGIN — which sign-ins to offer (telegram,nostr,ethereum)

# NOTE: no `base` key here — CLI deploys run from this directory and a base
# would make the CLI fall back to the repo-root netlify.toml (the dashboard
# app's). For git-integration builds, set Base directory = apps/flows in the
# Netlify UI instead.
[build]
  publish = "build"
  # --no-frozen-lockfile: pnpm-lock.yaml is deliberately untracked, and pnpm
  # defaults frozen-lockfile to ON when CI=true, so it must be disabled here.
  command = "cd ../.. && corepack enable && pnpm install --no-frozen-lockfile && pnpm -F @holons/core build && pnpm -F flows build"
  # The bundle compiles in the workspace packages, but Netlify's monorepo
  # change detection only watches the base directory: without this a commit
  # that only touches core (where every rule this app draws lives) would be
  # skipped as "no content change". Non-zero exit = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages/core ../../packages/holosphere"

# NOTE: no [functions] section — the platform builder honors the adapter's
# generated ESM function config. Local `netlify deploy` of a prebuilt dir
# does NOT (see apps/wequest/netlify.toml) — deploy via git push instead.

[build.environment]
  NODE_VERSION = "24"
  # Netlify's install step detects the package manager from lockfiles; with
  # pnpm-lock.yaml untracked it falls back to npm, which chokes on
  # workspace:* deps — force pnpm.
  NETLIFY_USE_PNPM = "true"
  NPM_FLAGS = "--prefer-online"
  # These VITE_* values are public-by-design (inlined into the client bundle
  # by contract). Whitelist them so Netlify's secrets scanner doesn't flag
  # them. NEVER add a private key here.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FLOWS_POT,VITE_FLOWS_APP,VITE_FLOWS_RELAYS,VITE_FLOWS_LOGIN"
  # The site opens on the Artizen Pot. It lives in the HolonsArtizenTest
  # namespace (the 2026-10-11 import), not "Holons", so both are pinned here;
  # values in this file override the same keys set in the Netlify UI.
  VITE_FLOWS_POT = "holon_gys43bbqut5rr7ka"
  VITE_FLOWS_APP = "HolonsArtizenTest"

# Long-cache the content-hashed build assets; never cache the HTML shell.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker must be re-checked on every load, or a deploy never lands.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
