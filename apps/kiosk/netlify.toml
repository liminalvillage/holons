# Netlify config for the Kiosk (apps/kiosk) — a SvelteKit app on adapter-netlify.
#
# In the Netlify site settings set the base directory to `apps/kiosk` so this
# file is picked up. Install + build run from the monorepo root (`cd ../..`) so
# the pnpm workspace is intact and @holons/core is BUILT before the kiosk
# (the apps consume core's compiled dist, not its TS source).
#
# Pages are client-side (SPA); login uses Telegram OIDC, which needs a server,
# so adapter-netlify serves the CSR shell + the /api/auth/* serverless functions
# and generates its own routing — do NOT add a manual `/* -> /index.html`
# redirect (it would shadow the function routes).
#
# Required server env vars (set in the Netlify UI, NOT here — they are secrets):
#   TELEGRAM_OIDC_CLIENT_ID, TELEGRAM_OIDC_CLIENT_SECRET, AUTH_JWT_SECRET
# Register each tenant's callback in BotFather Web Login → Allowed URLs, e.g.
#   https://akasha.hubs.network/api/auth/telegram/callback
#
# Multi-tenant: point a wildcard domain (`*.hubs.network`) at this one site.
# The app reads the host's subdomain at runtime and looks up the holon in
# src/lib/holons.ts — one deploy serves every registered holon. The session
# cookie is scoped to `.hubs.network` so login is shared across subdomains.

[build]
  base = "apps/kiosk"
  publish = "build"
  # --no-frozen-lockfile: pnpm-lock.yaml is deliberately untracked, and pnpm
  # defaults frozen-lockfile to ON when CI=true, so it must be disabled here.
  command = "cd ../.. && corepack enable && pnpm install --no-frozen-lockfile && pnpm -F @holons/core build && pnpm -F @holons/ai-ui build && pnpm -F kiosk build"
  # The kiosk bundle compiles in the workspace packages, but Netlify's default
  # monorepo change detection only watches the base directory — a commit that
  # only touches packages/holosphere (e.g. the 2026-07-23 self-hologram guard)
  # was skipped as "no content change" and never reached the screens. Build
  # whenever the app OR any workspace dependency it bundles has changed
  # (non-zero exit = build).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages/core ../../packages/holosphere ../../packages/ai-ui"

[build.environment]
  NODE_VERSION = "20"
  # Netlify's own install step runs before the build command and detects the
  # package manager from lockfiles; with pnpm-lock.yaml untracked it falls
  # back to npm, which chokes on workspace:* deps — force pnpm.
  NETLIFY_USE_PNPM = "true"
  NPM_FLAGS = "--prefer-online"
  # These VITE_* values are public-by-design (inlined into the client bundle by
  # contract). Whitelist them so Netlify's secrets scanner doesn't flag them.
  # NEVER add a private key here.
  #
  # Voice note: do NOT set VITE_OPENAI_API_KEY on Netlify — it would bake the
  # key into the public bundle. The "direct" voice mode takes its key from the
  # kiosk's Settings panel instead, per device (localStorage); the env var is a
  # local-dev fallback only.
  SECRETS_SCAN_OMIT_KEYS = "VITE_KIOSK_HOLON,VITE_KIOSK_APP,VITE_KIOSK_PEER,VITE_HOLONS_APP,VITE_TELEGRAM_BOT_USERNAME"

# Long-cache the content-hashed build assets; never cache the HTML shell.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
