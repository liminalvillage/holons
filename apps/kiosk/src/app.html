<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-512.svg" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#0e6b66" />
    <!-- Warm up the handshake to Telegram so the deferred SDK fetches sooner. -->
    <link rel="preconnect" href="https://telegram.org" crossorigin />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!-- Kiosk: lock zoom, fill notches, portrait-first. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Placeholder until hydration; the layout swaps in the holon's name. -->
    <title>Holons</title>
    <!-- Telegram WebApp SDK: enables identity when the kiosk is opened inside
         Telegram. The Login Widget (regular web) is injected on demand.
         `defer` keeps it off the critical rendering path while still running
         (in document order) before the SvelteKit app module, so window.Telegram
         is ready at mount. -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <!-- Restore the last day/night palette before first paint so a reload or
         power-cycle doesn't flash the wrong skin (lib/theme.ts recomputes the
         real sunset state right after mount). -->
    <script>
      try {
        var pin = localStorage.getItem("kiosk_theme");
        var last = localStorage.getItem("kiosk_theme_resolved");
        document.documentElement.dataset.theme =
          pin === "dark" || pin === "light"
            ? pin
            : last === "dark"
              ? "dark"
              : "light";
      } catch (e) {
        /* private mode / no storage — default light skin */
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
