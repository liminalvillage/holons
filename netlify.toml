[build]
  # `base` is the project root from Netlify's point of view. Keeping it at
  # apps/web is essential because @sveltejs/adapter-netlify writes its SSR
  # function to <project_root>/.netlify/functions-internal/, and Netlify
  # auto-uploads functions from that exact path. Moving base to the repo
  # root makes Netlify look for .netlify/ at the wrong location and SSR
  # routes return "page not found" even though the static build deploys.
  base = "apps/web"
  publish = "build"           # resolves to apps/web/build
  # Install + build run from the monorepo root (cd ../..) so the pnpm
  # workspace is intact and @holons/core is built BEFORE harvest-web,
  # then the final `pnpm run build` runs from apps/web so the adapter
  # writes its output where Netlify expects it.
  command = "cd ../.. && corepack enable && pnpm install --frozen-lockfile && pnpm -F @holons/core build && pnpm -F harvest-web build"

[build.environment]
  # Node.js version for builds
  NODE_VERSION = "20"
  # Force clean install to avoid stale cached node_modules
  NPM_FLAGS = "--prefer-online"
  # Netlify's secrets scanner flags any value of these env vars appearing in
  # build output. Vite's VITE_* prefix is the explicit contract that these
  # values WILL be inlined into client bundles — they are public-by-design
  # (public tokens, public URLs, public usernames). Whitelisting them here
  # tells the scanner "this leakage is intentional".
  #
  # ⚠️  Do NOT add VITE_HOLOSPHERE_PRIVATE_KEY here. Its name says it all:
  # a private key must never appear in client bundles. If that variable is
  # set in production, rename it (drop the VITE_ prefix) and load it
  # server-side only, or treat it as a dev-only convenience.
  SECRETS_SCAN_OMIT_KEYS = "VITE_MAPBOX_TOKEN,VITE_BOT_API_URL,VITE_TELEGRAM_BOT_USERNAME,VITE_LOCAL_MODE,VITE_QR_BASE_URL,VITE_DEV_TELEGRAM_USER_ID,VITE_DEV_TELEGRAM_USER_NAME"

# Build settings for SvelteKit
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://api.mapbox.com https://events.mapbox.com; style-src 'self' 'unsafe-inline' https://api.mapbox.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://api.mapbox.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.mapbox.com https://events.mapbox.com https://translate.google.com https://translate.googleapis.com wss://*.mapbox.com; frame-src https://translate.google.com;"

# Cache static assets (SvelteKit optimized)
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images and assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, s-maxage=86400"

# SvelteKit routing - adapter-netlify handles most routing automatically
# Redirect rules have been moved to _redirects file

# Environment variables (uncomment and configure as needed)
# [build.environment]
#   PUBLIC_API_URL = "your-api-url"
#   PUBLIC_MAPBOX_TOKEN = "your-mapbox-token"
#   PUBLIC_GOOGLE_TRANSLATE_KEY = "your-google-translate-key"
#   DATABASE_URL = "your-database-url"

# Functions configuration.
# @sveltejs/adapter-netlify writes the SSR function to
# .netlify/functions-internal/sveltekit-render.mjs (resolved from `base`,
# i.e. apps/web/.netlify/functions-internal/). Declaring it explicitly here
# makes function discovery deterministic and survives future Netlify default
# changes.
[functions]
  directory = ".netlify/functions-internal"

# Dev server configuration for local development
# [dev]
#   command = "npm run dev"
#   port = 5173
#   publish = "build"

# Build hooks (optional)
# [build.hooks]
#   init = "echo 'Starting SvelteKit build...'"

# Plugins for SvelteKit (optional)
# [[plugins]]
#   package = "@netlify/plugin-sveltekit"
