<!DOCTYPE html>
<meta charset="utf-8">

<body>
    <script src="http://d3js.org/d3.v3.min.js"></script>
    <script src="https://rawgit.com/jasondavies/d3-cloud/master/build/d3.layout.cloud.js"></script>
    <script>
        
        // Encapsulate the word cloud functionality
        function wordCloud(selector) {

            var fill = d3.scale.category20();

            //Construct the word cloud's SVG element
            var svg = d3.select(selector).append("svg")
                .attr("width", 1000)
                .attr("height", 1000)
                .append("g")
                .attr("transform", "translate(500,500)");


            //Draw the word cloud
            function draw(words) {
                var cloud = svg.selectAll("g text")
                    .data(words, function (d) { return d.text; })

                //Entering words
                cloud.enter()
                    .append("text")
                    .style("font-family", "Impact")
                    .style("fill", function (d, i) { return fill(i); })
                    .attr("text-anchor", "middle")
                    .attr('font-size', 1)
                    .text(function (d) { return d.text; });

                //Entering and existing words
                cloud
                    .style("font-size", function (d) { return d.size + "px"; })
                    .attr("transform", function (d) {
                        return "translate(" + [d.x, d.y] + ")rotate(" + d.rotate + ")";
                    })
                    .style("fill-opacity", 1);

                //Exiting words
                // cloud.exit()
                //     .transition()
                //         .duration(200)
                //         .style('fill-opacity', 1e-6)
                //         .attr('font-size', 1)
                //         .remove();
            }


            //Use the module pattern to encapsulate the visualisation code. We'll
            // expose only the parts that need to be public.
            return {

                //Recompute the word cloud for a new set of words. This method will
                // asycnhronously call draw when the layout has been computed.
                //The outside world will need to call this function, so make it part
                // of the wordCloud return value.
                update: function (words) {
                    d3.layout.cloud().size([1000, 1000])
                        .words(words)
                        .padding(3)
                        .rotate(function () { return ~~(Math.random() * 2) * 90; })
                        .font("Impact")
                        .fontSize(function (d) { return d.size; })
                        .on("end", draw)
                        .start();
                }
            }

        }

        // const words = [
        //     "Happiness", "Love", "Peace", "Health", "Wealth", "Time",
        //     "Freedom", "Security", "Knowledge", "Wisdom", "Adventure",
        //     "Passion", "Comfort", "Friendship", "Joy", "Fulfillment",
        //     "Success", "Creativity", "Inspiration", "Opportunity", "Purpose",
        //     "Laughter", "Sleep", "Compassion", "Serenity", "Respect",
        //     "Balance", "Trust", "Growth", "Harmony",
        //     "Happiness", "Love2", "Peace", "Health", "Wealth", "Time",
        //     "Freedom", "Security", "Knowledge", "Wisdom", "Adventure",
        //     "Passion", "Comfort", "Friendship", "Joy", "Fulfillment",
        //     "Success", "Creativity", "Inspiration2", "Opportunity", "Purpose",
        //     "Laughter", "Sleep", "Compassion", "Serenity", "Respect",
        //     "Balance", "Trust", "Growth", "Harmony"
        // ];

        //Prepare one of the sample sentences by removing punctuation,
        // creating an array of words and computing a size attribute from the frequency.
        function getWords(words) {
            const occurrences = words.reduce(function (acc, curr) {
                return acc[curr] ? ++acc[curr] : acc[curr] = 1, acc
            }, {});
            return words.map(function (d) {
                d.replace(/[!\.,:;\?]/g, '')
                return { text: d, size: 10 + occurrences[d] * 20 };
            })

        }


        //Create a new instance of the word cloud visualisation.
        var myWordCloud = wordCloud('body');
        window.myWordCloud = myWordCloud;
        myWordCloud.update(getWords(words));


    </script>
